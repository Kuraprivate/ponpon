<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fff7e6">
<title>ぽんぽんモンスター</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ぽんぽん">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet">
<style>
  :root { --bg: #fff7e6; --ink: #3b2a1a; --sub: #7a5c3e; --card: #ffffff; --line: #f1dcc0; --main: #f97316; --main-d: #c2410c; --ok: #16a34a; --ok-d: #166534; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Meiryo", sans-serif; overscroll-behavior: none; }
  body { display: flex; justify-content: center; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  button { font-family: inherit; cursor: pointer; border: 0; }
  .app { width: 100%; max-width: 820px; height: 100%; display: flex; flex-direction: column; padding: max(8px, env(safe-area-inset-top)) 6px max(10px, env(safe-area-inset-bottom)); }
  .hidden { display: none !important; }

  /* ---- ホーム ---- */
  #home { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; }
  .logo { font-size: clamp(34px, 10vw, 52px); font-weight: 900; line-height: 1.1; color: var(--main); text-shadow: 0 4px 0 #fed7aa; letter-spacing: .02em; }
  .logo small { display: block; font-size: .42em; color: var(--sub); text-shadow: none; margin-top: 6px; font-weight: 800; }
  #home-chars { width: min(320px, 80vw); height: 90px; }
  .big-btn { width: min(340px, 86vw); padding: 20px 10px; border-radius: 26px; font-size: 30px; font-weight: 900; color: #fff; background: linear-gradient(180deg, #fb923c, var(--main)); box-shadow: 0 7px 0 var(--main-d), 0 12px 24px rgba(194,65,12,.25); transition: transform .08s; }
  .big-btn:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--main-d); }
  .big-btn small { display: block; font-size: 17px; font-weight: 800; opacity: .95; margin-top: 2px; }
  .big-btn.green { background: linear-gradient(180deg, #4ade80, var(--ok)); box-shadow: 0 7px 0 var(--ok-d), 0 12px 24px rgba(22,101,52,.25); }
  .big-btn.green:active { box-shadow: 0 2px 0 var(--ok-d); }
  .sub-btn { padding: 14px 22px; border-radius: 18px; font-size: 20px; font-weight: 800; color: var(--sub); background: var(--card); border: 3px solid var(--line); }
  .sub-btn:active { background: #fff1dd; }
  .home-stats { font-size: 20px; font-weight: 800; color: var(--sub); }
  .home-stats b { color: #eab308; font-size: 24px; }

  /* ---- ゲーム ---- */
  #game { flex: 1; display: flex; flex-direction: column; gap: 6px; min-height: 0; }
  .top { display: flex; align-items: center; gap: 10px; }
  .lv { font-size: 24px; font-weight: 900; white-space: nowrap; }
  .lv span { font-size: 32px; color: var(--main); }
  .goal { flex: 1; min-width: 0; }
  .goal-txt { font-size: 19px; font-weight: 800; text-align: right; white-space: nowrap; }
  .goal-txt b { font-size: 26px; }
  .bar { height: 16px; border-radius: 99px; background: #f3e3cc; overflow: hidden; margin-top: 3px; border: 2px solid #ead2b0; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #facc15, #f97316); border-radius: 99px; transition: width .35s; }
  .bar.done i { background: linear-gradient(90deg, #4ade80, #16a34a); }
  .menu-btn { width: 64px; height: 52px; border-radius: 16px; background: var(--card); border: 3px solid var(--line); font-size: 15px; font-weight: 800; color: var(--sub); line-height: 1.1; flex-shrink: 0; }
  .msg { min-height: 34px; text-align: center; font-size: 21px; font-weight: 800; color: var(--sub); }
  .msg.good { color: var(--ok); }
  .board-wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  #board { display: block; border-radius: 22px; background: #fffdf8; box-shadow: inset 0 0 0 4px #f1dcc0, 0 6px 18px rgba(122,92,62,.12); touch-action: none; }
  .bottom { display: flex; gap: 12px; }
  .act { flex: 1; padding: 15px 6px; border-radius: 20px; font-size: 22px; font-weight: 900; background: var(--card); color: var(--ink); border: 3px solid var(--line); box-shadow: 0 5px 0 #ead2b0; }
  .act:active { transform: translateY(4px); box-shadow: 0 1px 0 #ead2b0; }
  .act:disabled { opacity: .4; }
  .act small { font-size: 16px; color: var(--sub); }

  /* ---- 結果・説明 ---- */
  .overlay { position: fixed; inset: 0; background: rgba(59,42,26,.45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .panel { width: min(420px, 100%); background: var(--card); border-radius: 30px; padding: 26px 20px 22px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,.25); animation: pop .35s cubic-bezier(.2,1.5,.4,1); }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .r-title { font-size: 40px; font-weight: 900; color: var(--main); }
  .r-title.fail { color: #2563eb; }
  .stars { font-size: 54px; letter-spacing: 6px; margin: 4px 0; }
  .stars .off { color: #e7dccd; } .stars .on { color: #facc15; text-shadow: 0 3px 0 #ca8a04; display: inline-block; animation: starIn .5s both; }
  @keyframes starIn { from { transform: scale(0) rotate(-90deg); } to { transform: scale(1) rotate(0); } }
  .r-score { font-size: 22px; font-weight: 800; color: var(--sub); margin: 6px 0 18px; line-height: 1.5; }
  .r-score b { font-size: 34px; color: var(--ink); }
  .panel .big-btn { width: 100%; }
  .panel .sub-btn { margin-top: 14px; }
  .how { text-align: left; font-size: 20px; line-height: 1.6; font-weight: 800; margin: 10px 0 18px; }
  .how p { margin: 0 0 12px; display: flex; gap: 10px; }
  .how p span { flex-shrink: 0; width: 34px; height: 34px; border-radius: 99px; background: var(--main); color: #fff; display: flex; align-items: center; justify-content: center; }
  .size-row { display: flex; gap: 6px; justify-content: center; margin-top: 8px; }
  .size-row button { flex: 1; white-space: nowrap; padding: 10px 4px; border-radius: 14px; font-size: 18px; font-weight: 800; background: #fff1dd; color: var(--sub); border: 3px solid transparent; }
  .size-row button.on { border-color: var(--main); color: var(--main-d); background: #fff; }
  .turns { flex: 1; text-align: center; font-size: 22px; font-weight: 800; color: var(--sub); white-space: nowrap; }
  .turns b { font-size: 34px; color: var(--ink); }
  .turns.low b { color: #dc2626; }
  .how p .t { display: block; flex: 1; width: auto; height: auto; background: none; color: inherit; border-radius: 0; }
  .how p b { color: var(--main-d); }
  .board-wrap { flex-direction: column; gap: 6px; }
  #enemy { display: block; border-radius: 22px; box-shadow: 0 4px 14px rgba(122,92,62,.15); }
  .panel { max-height: 92vh; overflow-y: auto; }
</style>
</head>
<body>
<div class="app">
  <!-- ホーム -->
  <section id="home">
    <div class="logo">ぽんぽん<br>モンスター<small>そろえて敵を倒す 脳トレパズル</small></div>
    <canvas id="home-chars"></canvas>
    <button id="btn-play" class="big-btn">遊ぶ<small id="play-sub">レベル 1</small></button>
    <div class="home-stats">集めた星 <b>★ <span id="home-stars">0</span></b></div>
    <button id="btn-how" class="sub-btn">遊び方・練習</button>
    <button id="btn-a2hs" class="sub-btn hidden">📱 ホーム画面に追加</button>
  </section>

  <!-- ゲーム -->
  <section id="game" class="hidden">
    <div class="top">
      <div class="lv">レベル <span id="g-lv">1</span></div>
      <div class="turns" id="turns-box">残り <b id="g-turns">10</b> 回</div>
      <button id="btn-menu" class="menu-btn">ホーム</button>
    </div>
    <div class="msg" id="g-msg"></div>
    <div class="board-wrap" id="board-wrap"><canvas id="enemy"></canvas><canvas id="board"></canvas></div>
    <div class="bottom" id="bottom-btns">
      <button id="btn-undo" class="act">1手戻す <small id="undo-n">(3)</small></button>
      <button id="btn-hint" class="act">ヒント</button>
    </div>
    <div class="bottom hidden" id="tut-btns">
      <button id="btn-tut-skip" class="act">練習を飛ばす</button>
    </div>
  </section>
</div>

<!-- 結果 -->
<div id="result" class="overlay hidden">
  <div class="panel">
    <div class="r-title" id="r-title">クリア！</div>
    <div class="stars" id="r-stars"></div>
    <div class="r-score" id="r-score"></div>
    <button id="r-next" class="big-btn green">次へ</button>
    <button id="r-home" class="sub-btn">ホームへ</button>
  </div>
</div>

<!-- お知らせ（説明など） -->
<div id="note" class="overlay hidden">
  <div class="panel">
    <div class="r-title" id="note-title" style="font-size:32px"></div>
    <div class="how" id="note-body"></div>
    <div id="note-size" class="hidden">
      <div style="font-size:18px;font-weight:800;color:var(--sub)">文字の大きさ</div>
      <div class="size-row" id="size-row">
        <button data-size="1">普通</button><button data-size="1.12">大きい</button><button data-size="1.25">特大</button>
      </div>
    </div>
    <button id="note-ok" class="big-btn" style="margin-top:18px">わかった</button>
  </div>
</div>

<script>
"use strict";
// ================= 設定 =================
const COLS = 6, ROWS = 5, TURNS = 10;
const store = { get(k) { try { return localStorage.getItem("pp_" + k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem("pp_" + k, v); } catch (e) { } } };
// なかまたち（Fantasy Defense のキャラをまるくデフォルメ）
const MONS = [
  { name: "スライム", col: "#22c55e", dark: "#15803d", bg: "#dcfce7" },
  { name: "ハチ", col: "#facc15", dark: "#a16207", bg: "#fef9c3" },
  { name: "水の精", col: "#38bdf8", dark: "#0369a1", bg: "#e0f2fe" },
  { name: "炎の子", col: "#f87171", dark: "#b91c1c", bg: "#fee2e2" },
  { name: "おばけ", col: "#c084fc", dark: "#7e22ce", bg: "#f3e8ff" }
];
// てき（Fantasy Defense の敵たち）
const ENEMIES = {
  goblin: { name: "ゴブリン", atk: [], sky: ["#bbf7d0", "#fef9c3"] },
  snow: { name: "雪だるまキング", atk: ["freeze"], sky: ["#bae6fd", "#f0f9ff"] },
  golem: { name: "ゴーレム", atk: ["rock"], sky: ["#d6d3d1", "#fef3c7"] },
  bat: { name: "闇コウモリ", atk: ["dark"], sky: ["#c4b5fd", "#ede9fe"] },
  dragon: { name: "ドラゴン", atk: ["freeze", "rock"], sky: ["#fecaca", "#ffedd5"], boss: true },
  maou: { name: "魔王", atk: ["freeze", "rock", "dark"], sky: ["#a78bfa", "#fce7f3"], boss: true }
};
function levelInfo(lv) {
  const rnd = n => { let x = Math.sin(lv * 91.7 + n * 13.1) * 43758.5; return x - Math.floor(x); };
  const T = [
    null,
    { e: "goblin", kinds: 4, hp: 500 },
    { e: "goblin", kinds: 4, hp: 650, weak: 3 },
    { e: "goblin", kinds: 4, hp: 750, weak: 2 },
    { e: "snow", kinds: 4, hp: 800, weak: 3, cd: 3 },
    { e: "snow", kinds: 5, hp: 500, weak: 3, cd: 3 },
    { e: "golem", kinds: 5, hp: 550, weak: 2, cd: 3, rocks: 2 },
    { e: "golem", kinds: 5, hp: 600, weak: 2, cd: 3, rocks: 2 },
    { e: "bat", kinds: 5, hp: 600, weak: 1, cd: 3 },
    { e: "bat", kinds: 5, hp: 650, weak: 1, cd: 3 },
    { e: "dragon", kinds: 5, hp: 800, weak: 2, cd: 3 }
  ];
  if (lv <= 10) return Object.assign({ cd: 0, rocks: 0 }, T[lv]);
  const cyc = ["snow", "golem", "bat", "dragon", "maou"], e = cyc[(lv - 11) % 5];
  const hp = Math.min(1100, 600 + (lv - 10) * 25) * (ENEMIES[e].boss ? 1.2 : 1);
  return { e, kinds: 5, hp: Math.round(hp / 10) * 10, weak: Math.floor(rnd(1) * 5), cd: 3, rocks: e === "golem" ? 2 : 0 };
}
const comboMul = c => 1 + 0.25 * (c - 1);

// ================= 状態 =================
let level = Math.max(1, Number(store.get("level")) || 1);
let starsArr = (() => { try { return JSON.parse(store.get("stars") || "[]"); } catch (e) { return []; } })();
let fontScale = Number(store.get("font")) || 1;
const G = {
  grid: [], kinds: 4, turns: TURNS, undo: [], undoLeft: 3, state: "idle", over: false,
  held: null, hx: 0, hy: 0, moved: 0, combo: 0, popT: 0, queue: [], fx: [], floats: [], flash: 0, shake: 0, comboShow: null,
  hint: null, hintT: 0, idle: 0, cell: 60, nextId: 1, tut: null,
  en: null   // { key, hp, max, cd, cdMax, weak, hurt, atkAnim, shake, dmgs: [] }
};
// grid[y][x]（y=0 が上）。中身は { id, t, px, py, vy, frozen, rock, dark, bomb }   t=-1 は いわ

// ================= 絵（なかま以外） =================
function drawTile(g, c, x, y, C, time, reveal) {
  if (c.rock) {
    g.save(); g.translate(x, y);
    g.fillStyle = "#a8a29e"; g.strokeStyle = "#57534e"; g.lineWidth = Math.max(2, C * 0.045);
    g.beginPath(); g.moveTo(C * 0.12, C * 0.82); g.lineTo(C * 0.18, C * 0.38); g.lineTo(C * 0.4, C * 0.16); g.lineTo(C * 0.7, C * 0.2); g.lineTo(C * 0.88, C * 0.45); g.lineTo(C * 0.86, C * 0.84); g.closePath(); g.fill(); g.stroke();
    g.fillStyle = "#d6d3d1"; g.beginPath(); g.moveTo(C * 0.3, C * 0.35); g.lineTo(C * 0.45, C * 0.24); g.lineTo(C * 0.5, C * 0.4); g.closePath(); g.fill();
    g.strokeStyle = "#78716c"; g.beginPath(); g.moveTo(C * 0.55, C * 0.5); g.lineTo(C * 0.65, C * 0.62); g.lineTo(C * 0.6, C * 0.75); g.stroke();
    g.restore(); return;
  }
  if (c.dark > 0 && !reveal) {
    g.save(); g.translate(x, y);
    g.fillStyle = "#3b2f5c"; roundRect(g, C * 0.05, C * 0.05, C * 0.9, C * 0.9, C * 0.22); g.fill();
    g.fillStyle = "rgba(196,181,253,.25)"; g.beginPath(); g.arc(C * 0.5, C * 0.5, C * 0.32 + Math.sin(time * 3 + c.id) * C * 0.02, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#ede9fe"; g.font = `900 ${Math.round(C * 0.5)}px "M PLUS Rounded 1c", sans-serif`; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText("？", C * 0.5, C * 0.53);
    g.restore();
  } else g.drawImage(sprites[c.t], x, y, C, C);
  if (c.bomb) {
    g.save();
    const r = C * 0.17, bx = x + C * 0.8, by = y + C * 0.2;
    g.fillStyle = "#fde047"; g.strokeStyle = "#a16207"; g.lineWidth = 2; star(g, bx, by, r * 1.25); g.fill(); g.stroke();
    g.restore();
    g.save(); g.globalCompositeOperation = "source-atop"; g.restore();
  }
  if (c.frozen) {
    g.save(); g.translate(x, y);
    g.fillStyle = "rgba(186,230,253,.62)"; roundRect(g, C * 0.04, C * 0.04, C * 0.92, C * 0.92, C * 0.2); g.fill();
    g.strokeStyle = "#e0f2fe"; g.lineWidth = Math.max(2, C * 0.04); g.stroke();
    g.strokeStyle = "rgba(255,255,255,.9)"; g.lineWidth = Math.max(1.5, C * 0.025); g.lineCap = "round";
    for (const [ax, ay, l, a] of [[0.25, 0.25, 0.14, 0.8], [0.72, 0.7, 0.12, -0.6], [0.7, 0.28, 0.08, 0.3]]) {
      for (let k = 0; k < 3; k++) { const an = a + k * Math.PI / 3; g.beginPath(); g.moveTo(C * ax - Math.cos(an) * C * l, C * ay - Math.sin(an) * C * l); g.lineTo(C * ax + Math.cos(an) * C * l, C * ay + Math.sin(an) * C * l); g.stroke(); }
    }
    g.restore();
  }
}
function drawEnemy(g, key, cx, by, s, time, hurt) {
  g.save(); g.translate(cx, by);
  const bob = Math.sin(time * 2.4) * s * 0.03; g.translate(0, bob);
  if (hurt > 0) { g.filter = "brightness(2.2)"; }
  g.lineWidth = Math.max(2, s * 0.03); g.lineJoin = "round";
  const eyes = (y, sp, col) => {
    [-1, 1].forEach(k => {
      g.fillStyle = "#fff"; g.beginPath(); g.ellipse(k * sp, y, s * 0.075, s * 0.085, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = col || "#1c1917"; g.beginPath(); g.arc(k * sp - k * s * 0.01, y + s * 0.015, s * 0.04, 0, Math.PI * 2); g.fill();
      g.strokeStyle = "#1c1917"; g.lineWidth = s * 0.03; g.beginPath(); g.moveTo(k * (sp + s * 0.08), y - s * 0.1); g.lineTo(k * (sp - s * 0.06), y - s * 0.06); g.stroke();
    });
  };
  if (key === "goblin") {
    g.fillStyle = "#65a30d"; g.strokeStyle = "#365314";
    [-1, 1].forEach(k => { g.beginPath(); g.moveTo(k * s * 0.25, -s * 0.5); g.lineTo(k * s * 0.55, -s * 0.72); g.lineTo(k * s * 0.32, -s * 0.36); g.closePath(); g.fill(); g.stroke(); });
    g.beginPath(); g.ellipse(0, -s * 0.38, s * 0.33, s * 0.36, 0, 0, Math.PI * 2); g.fill(); g.stroke();
    eyes(-s * 0.45, s * 0.13);
    g.fillStyle = "#fff"; g.beginPath(); g.moveTo(-s * 0.12, -s * 0.25); g.lineTo(s * 0.12, -s * 0.25); g.lineTo(s * 0.06, -s * 0.2); g.lineTo(0, -s * 0.25); g.lineTo(-s * 0.06, -s * 0.2); g.closePath(); g.fill();
    g.fillStyle = "#92400e"; g.strokeStyle = "#451a03"; g.save(); g.translate(s * 0.38, -s * 0.2); g.rotate(-0.5); roundRect(g, -s * 0.04, -s * 0.3, s * 0.1, s * 0.34, s * 0.05); g.fill(); g.stroke(); g.restore();
  } else if (key === "snow") {
    g.fillStyle = "#fff"; g.strokeStyle = "#7dd3fc";
    g.beginPath(); g.arc(0, -s * 0.2, s * 0.26, 0, Math.PI * 2); g.fill(); g.stroke();
    g.beginPath(); g.arc(0, -s * 0.55, s * 0.2, 0, Math.PI * 2); g.fill(); g.stroke();
    g.fillStyle = "#1d4ed8"; g.strokeStyle = "#1e3a8a"; roundRect(g, -s * 0.14, -s * 0.95, s * 0.28, s * 0.24, s * 0.03); g.fill(); g.stroke(); g.fillRect(-s * 0.2, -s * 0.73, s * 0.4, s * 0.05);
    g.fillStyle = "#fde047"; star(g, 0, -s * 0.84, s * 0.06); g.fill();
    eyes(-s * 0.58, s * 0.08, "#0c4a6e");
    g.fillStyle = "#f97316"; g.beginPath(); g.moveTo(0, -s * 0.52); g.lineTo(s * 0.16, -s * 0.48); g.lineTo(0, -s * 0.46); g.fill();
    g.strokeStyle = "#78350f"; g.lineWidth = s * 0.035; [-1, 1].forEach(k => { g.beginPath(); g.moveTo(k * s * 0.24, -s * 0.25); g.lineTo(k * s * 0.45, -s * 0.42); g.stroke(); });
  } else if (key === "golem") {
    g.fillStyle = "#a8a29e"; g.strokeStyle = "#44403c";
    roundRect(g, -s * 0.34, -s * 0.72, s * 0.68, s * 0.64, s * 0.1); g.fill(); g.stroke();
    [-1, 1].forEach(k => { roundRect(g, k * s * 0.34 - (k > 0 ? 0 : s * 0.16), -s * 0.6, s * 0.16, s * 0.42, s * 0.06); g.fill(); g.stroke(); });
    g.fillStyle = "#78716c"; g.fillRect(-s * 0.2, -s * 0.3, s * 0.1, s * 0.04); g.fillRect(s * 0.05, -s * 0.22, s * 0.12, s * 0.04);
    g.fillStyle = "#fbbf24"; g.shadowColor = "#f59e0b"; g.shadowBlur = s * 0.1;
    [-1, 1].forEach(k => { g.fillRect(k * s * 0.13 - s * 0.05, -s * 0.55, s * 0.1, s * 0.06); });
    g.shadowBlur = 0;
  } else if (key === "bat") {

let last = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, last ? (now - last) / 1000 : 0.016); last = now;
  if (document.getElementById("game").classList.contains("hidden")) { drawHome(now / 1000); return; }
  const C = G.cell;
  eachCell((c, x, y) => {
    if (G.held && c === G.held.c) return;
    const tx = x * C, ty = y * C;
    if (c.py < ty - C * 0.6 && Math.abs(c.px - tx) < 0.5) { c.vy += 3000 * dt; c.py = Math.min(ty, c.py + c.vy * dt); if (c.py >= ty) { c.vy = 0; c.land = 1; } }
    else { c.vy = 0; c.px += (tx - c.px) * Math.min(1, dt * 18); c.py += (ty - c.py) * Math.min(1, dt * 18); if (Math.abs(c.px - tx) < 0.5) c.px = tx; if (Math.abs(c.py - ty) < 0.5) c.py = ty; }
    if (c.land) c.land = Math.max(0, c.land - dt * 5);
    if (c.wob) c.wob = Math.max(0, c.wob - dt * 2.5);
  });
  if (G.state === "resolve") resolveStep(dt);
  G.fx.forEach(f => { f.life += dt; if (f.k === "star") { f.vy += 900 * dt; f.x += f.vx * dt; f.y += f.vy * dt; } });
  G.fx = G.fx.filter(f => f.life < f.max);
  if (G.comboShow) { G.comboShow.life += dt; if (G.comboShow.life > 0.9) G.comboShow = null; }
  G.flash = Math.max(0, G.flash - dt); G.shake = Math.max(0, G.shake - dt);
  G.hintT += dt;
  if (G.en) { const E = G.en; E.hurt = Math.max(0, E.hurt - dt); E.shake = Math.max(0, E.shake - dt); E.atkAnim = Math.max(0, E.atkAnim - dt); if (E.dead) E.dead += dt; E.dmgs.forEach(d => d.life += dt); E.dmgs = E.dmgs.filter(d => d.life < 1.1); }
  if (!G.over && !G.tut && G.state === "idle") { G.idle += dt; if (G.idle > 20 && !G.hint && settled()) { G.hint = findHint(); G.hintT = 0; } }
  draw(now / 1000);
  if (G.en) drawEnemyPanel(now / 1000);
}

    g.fillStyle = "#7f1d1d"; g.font = `800 ${Math.round(H * 0.095)}px "M PLUS Rounded 1c", sans-serif`; g.textBaseline = "top"; g.fillText("攻撃", cx, cy + r + 3);

  E.dmgs.forEach(d => {

    const fs = Math.round(H * (d.weak ? 0.24 : 0.19) * (1 + 0.4 * Math.max(0, 1 - q * 6)));
    g.font = `900 ${fs}px "M PLUS Rounded 1c", sans-serif`; g.textAlign = "center"; g.textBaseline = "middle"; g.lineJoin = "round";

    if (d.weak) { g.font = `900 ${Math.round(fs * 0.5)}px "M PLUS Rounded 1c", sans-serif`; g.lineWidth = 4; g.strokeText("苦手！", x, y - fs * 0.75); g.fillStyle = "#b91c1c"; g.fillText("苦手！", x, y - fs * 0.75); }

}
function draw(time) {
  const C = G.cell, W = C * COLS, H = C * ROWS;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (G.shake > 0) ctx.translate((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8);
  ctx.fillStyle = "#fbf1e2";
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if ((x + y) % 2) ctx.fillRect(x * C, y * C, C, C);
  const hp = G.hint, start = hp && hp[0];
  eachCell((c, x, y) => {
    if (G.held && c === G.held.c) return;
    let sx = 1, sy = 1, dx = 0;
    if (c.land) { sx = 1 + c.land * 0.1; sy = 1 - c.land * 0.1; }
    if (c.wob) dx = Math.sin(c.wob * 30) * 5 * c.wob;
    const isS = start && start[0] === x && start[1] === y && G.state === "idle";
    const hs = isS ? 1 + 0.1 * Math.abs(Math.sin(G.hintT * 4)) : 1;
    ctx.save(); ctx.translate(c.px + C / 2 + dx, c.py + C); ctx.scale(sx * hs, sy * hs);

    ctx.restore();

    if (isS) { ctx.save(); ctx.strokeStyle = `rgba(249,115,22,${0.55 + 0.45 * Math.abs(Math.sin(G.hintT * 4))})`; ctx.lineWidth = 5; roundRect(ctx, c.px + 3, c.py + 3, C - 6, C - 6, C * 0.22); ctx.stroke(); ctx.restore(); }
  });
  if (hp && hp.length > 1 && G.state === "idle") {
    ctx.save(); ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.strokeStyle = "rgba(255,255,255,.95)"; ctx.lineWidth = C * 0.2;
    const line = () => { ctx.beginPath(); hp.forEach(([x, y], i) => { const X = x * C + C / 2, Y = y * C + C / 2; i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); }); ctx.stroke(); };
    line(); ctx.strokeStyle = "rgba(234,88,12,.9)"; ctx.lineWidth = C * 0.1; line();
    const [ax, ay] = hp[hp.length - 1], [bx, by] = hp[hp.length - 2], ang = Math.atan2(ay - by, ax - bx), X = ax * C + C / 2, Y = ay * C + C / 2;
    ctx.fillStyle = "rgba(234,88,12,.95)"; ctx.beginPath(); ctx.moveTo(X + Math.cos(ang) * C * 0.28, Y + Math.sin(ang) * C * 0.28); ctx.lineTo(X + Math.cos(ang + 2.4) * C * 0.25, Y + Math.sin(ang + 2.4) * C * 0.25); ctx.lineTo(X + Math.cos(ang - 2.4) * C * 0.25, Y + Math.sin(ang - 2.4) * C * 0.25); ctx.fill();
    const segs = hp.length - 1, q = (G.hintT * 0.9) % 1.6, u = Math.min(1, Math.max(0, (q - 0.2) / 1.1)) * segs, k = Math.min(segs - 1, Math.floor(u)), f = u - k;
    const fx = (hp[k][0] + (hp[k + 1][0] - hp[k][0]) * f) * C + C / 2, fy = (hp[k][1] + (hp[k + 1][1] - hp[k][1]) * f) * C + C / 2;
    ctx.globalAlpha = q > 1.4 ? Math.max(0, 1 - (q - 1.4) / 0.2) : 1;
    ctx.fillStyle = "rgba(255,255,255,.9)"; ctx.strokeStyle = "#7a5c3e"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(fx, fy, C * 0.2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.font = `${Math.round(C * 0.55)}px sans-serif`; ctx.textAlign = "center"; ctx.fillText("👆", fx + C * 0.12, fy + C * 0.5);
    ctx.restore();
  }
  if (G.held) {
    ctx.save(); ctx.translate(G.hx, G.hy); ctx.scale(1.18, 1.18);
    ctx.shadowColor = "rgba(0,0,0,.3)"; ctx.shadowBlur = 14; ctx.shadowOffsetY = 6;
    drawTile(ctx, G.held.c, -C / 2, -C / 2, C, time, true); ctx.restore();
  }
  G.fx.forEach(f => {
    const q = f.life / f.max;
    ctx.save();
    if (f.k === "pop") { ctx.globalAlpha = 1 - q; const s = 1 + q * 0.6; ctx.translate(f.x + C / 2, f.y + C / 2); ctx.scale(s, s); drawTile(ctx, f.c, -C / 2, -C / 2, C, time); }
    else if (f.k === "star") { ctx.globalAlpha = 1 - q; ctx.fillStyle = f.col; star(ctx, f.x, f.y, C * 0.12 * (1 - q * 0.5)); ctx.fill(); }
    else if (f.k === "boom") { ctx.globalAlpha = 1 - q; const g2 = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, C * 1.7); g2.addColorStop(0, "rgba(254,240,138,1)"); g2.addColorStop(0.5, "rgba(251,146,60,.8)"); g2.addColorStop(1, "rgba(251,146,60,0)"); ctx.fillStyle = g2; ctx.beginPath(); ctx.arc(f.x, f.y, C * (0.6 + q * 1.2), 0, Math.PI * 2); ctx.fill(); }
    else if (f.k === "ice") { ctx.globalAlpha = 1 - q; ctx.strokeStyle = "#7dd3fc"; ctx.lineWidth = 3; for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3, r1 = C * 0.2, r2 = C * (0.25 + q * 0.4); ctx.beginPath(); ctx.moveTo(f.x + C / 2 + Math.cos(a) * r1, f.y + C / 2 + Math.sin(a) * r1); ctx.lineTo(f.x + C / 2 + Math.cos(a) * r2, f.y + C / 2 + Math.sin(a) * r2); ctx.stroke(); } }
    else if (f.k === "rubble") { ctx.globalAlpha = 1 - q; ctx.fillStyle = "#78716c"; for (let i = 0; i < 5; i++) ctx.fillRect(f.x + C / 2 + Math.cos(i * 1.3) * C * q * 0.6 - 4, f.y + C / 2 + Math.sin(i * 1.3) * C * q * 0.6 + q * q * C * 0.5 - 4, 8, 8); }
    else if (f.k === "born") { ctx.globalAlpha = 1 - q; ctx.strokeStyle = "#facc15"; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(f.x + C / 2, f.y + C / 2, C * (0.3 + q * 0.6), 0, Math.PI * 2); ctx.stroke(); }
    else if (f.k === "shot") { ctx.globalAlpha = 1 - q; ctx.fillStyle = f.col; ctx.beginPath(); ctx.arc(f.x, f.y - q * (f.y + C), C * 0.18, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
  });
  const txt = (t, x, y, fs, col) => { ctx.font = `900 ${fs}px "M PLUS Rounded 1c", sans-serif`; ctx.lineWidth = fs * 0.24; ctx.strokeStyle = "#fff"; ctx.fillStyle = col; ctx.strokeText(t, x, y); ctx.fillText(t, x, y); };
  ctx.textAlign = "center"; ctx.lineJoin = "round";
  if (G.comboShow) { const cs = G.comboShow, q = cs.life / 0.9; ctx.save(); ctx.globalAlpha = Math.min(1, (1 - q) * 3); const s = 1 + 0.4 * Math.max(0, 1 - q * 5); ctx.translate(cs.x, cs.y - q * C * 0.5); ctx.scale(s, s); txt(`${cs.n} コンボ`, 0, 0, Math.round(C * 0.42), cs.n >= 3 ? "#ea580c" : "#3b2a1a"); ctx.restore(); }
  ctx.restore();
  if (G.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${G.flash})`; ctx.fillRect(0, 0, W, H); }
}
// ホームの なかまたち
const hc = document.getElementById("home-chars"), hctx = hc.getContext("2d");
const homeSpr = [];
function drawHome(time) {
  const r = hc.getBoundingClientRect(), d = Math.min(2.5, window.devicePixelRatio || 1);
  if (hc.width !== Math.round(r.width * d)) { hc.width = Math.round(r.width * d); hc.height = Math.round(r.height * d); homeSpr.length = 0; }
  const s = Math.min(hc.width / 5.2, hc.height * 0.85);
  if (!homeSpr.length) for (let t = 0; t < 5; t++) { const c = document.createElement("canvas"); c.width = c.height = Math.ceil(s); drawMon(c.getContext("2d"), t, s); homeSpr.push(c); }
  hctx.clearRect(0, 0, hc.width, hc.height);
  for (let t = 0; t < 5; t++) {
    const x = hc.width / 2 + (t - 2) * s * 1.02, j = Math.max(0, Math.sin(time * 3 - t * 0.8)) * s * 0.18;
    hctx.drawImage(homeSpr[t], x - s / 2, hc.height - s - j, s, s);
  }
}

// ================= 画面・操作 =================
function showScreen(n) {
  document.getElementById("home").classList.toggle("hidden", n === "game");
  document.getElementById("game").classList.toggle("hidden", n !== "game");
  if (n !== "game") refreshHome();
}
function refreshHome() {
  document.getElementById("play-sub").textContent = `レベル ${level}`;
  document.getElementById("home-stars").textContent = starsArr.reduce((a, b) => a + (b || 0), 0);
}
function applyFont() {
  document.querySelectorAll(".top, .msg, .turns, .bottom, #home, .panel").forEach(el => el.style.zoom = fontScale);
  document.querySelectorAll("#size-row button").forEach(b => b.classList.toggle("on", Number(b.dataset.size) === fontScale));
}
let noteThen = null;
function openNote(title, rows, then, okText, showSize, img) {
  document.getElementById("note-title").textContent = title;
  document.getElementById("note-body").innerHTML = (img || "") + rows.map(([n, t]) => `<p><span>${n}</span><span class="t">${t}</span></p>`).join("");
  document.getElementById("note-ok").textContent = okText || "わかった";
  document.getElementById("note-size").classList.toggle("hidden", !showSize);
  noteThen = then || null; applyFont();
  document.getElementById("note").classList.remove("hidden");
}
document.getElementById("note-ok").addEventListener("click", () => { document.getElementById("note").classList.add("hidden"); if (noteThen) { const f = noteThen; noteThen = null; f(); } });
const INTRO_ROWS = [
  ["1", "キャラを<b>指で押さえたまま</b>動かすと、隣のキャラと入れ替わります"],
  ["2", "同じキャラが<b>縦か横に3つ以上</b>並ぶと消えます"],
  ["3", "1回で何か所もそろえると<b>コンボ</b>！ 敵に大ダメージ"]
];
cv.addEventListener("pointerdown", onDown);
cv.addEventListener("pointermove", onMove);
cv.addEventListener("pointerup", onUp);
cv.addEventListener("pointercancel", onUp);
document.getElementById("btn-play").addEventListener("click", () => {
  if (store.get("tutDone") !== "1") { openNote("遊び方", INTRO_ROWS, startTutorial, "練習してみる", true); return; }
  startLevel();

document.getElementById("btn-how").addEventListener("click", () => openNote("遊び方", INTRO_ROWS, startTutorial, "練習してみる", true));

// ================= ホーム画面に追加（アプリのように開く） =================
let a2hsEvt = null, pwaOk = false;
const standalone = () => matchMedia("(display-mode: standalone)").matches || matchMedia("(display-mode: fullscreen)").matches || navigator.standalone === true;
